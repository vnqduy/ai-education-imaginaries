<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760">
<title>Workflow for analysing educational AI futures in news coverage</title>
<desc>Six stages from corpus construction to account review, followed by relational interpretation and descriptive outlet comparison. Recovery and correction loops return to extraction and coding.</desc>
<rect width="600" height="760" fill="white"/>
<rect x="90" y="15" width="420" height="72" fill="#fafafa" stroke="#333" stroke-width=".8"/>
<text x="300.0" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">1  Corpus construction</text>
<text x="300.0" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">Search, screen titles, consolidate duplicate hits,</text>
<text x="300.0" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">and retrieve article texts</text>
<rect x="90" y="115" width="420" height="72" fill="#fafafa" stroke="#333" stroke-width=".8"/>
<text x="300.0" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">2  Structured extraction</text>
<text x="300.0" y="159" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">Extract twelve SIPC fields; preserve evidence,</text>
<text x="300.0" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">qualifications and distinct voices</text>
<polyline points="300,87 300,115" fill="none" stroke="#555" stroke-width=".8"/>
<polygon points="300,115 303.0,108.0 297.0,108.0" fill="#555"/>
<rect x="90" y="215" width="420" height="72" fill="#fafafa" stroke="#333" stroke-width=".8"/>
<text x="300.0" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">3  Source review and eligibility assessment</text>
<text x="300.0" y="259" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">Assess source adequacy and educational futurity separately;</text>
<text x="300.0" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">recover incomplete sources where possible</text>
<polyline points="300,187 300,215" fill="none" stroke="#555" stroke-width=".8"/>
<polygon points="300,215 303.0,208.0 297.0,208.0" fill="#555"/>
<rect x="90" y="315" width="420" height="72" fill="#fafafa" stroke="#333" stroke-width=".8"/>
<text x="300.0" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">4  Codebook development</text>
<text x="300.0" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">Develop field categories from the full extraction corpus;</text>
<text x="300.0" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">review definitions and freeze the codebook</text>
<polyline points="300,287 300,315" fill="none" stroke="#555" stroke-width=".8"/>
<polygon points="300,315 303.0,308.0 297.0,308.0" fill="#555"/>
<rect x="90" y="415" width="420" height="72" fill="#fafafa" stroke="#333" stroke-width=".8"/>
<text x="300.0" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">5  Account-level coding</text>
<text x="300.0" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">Apply the codebook to attributed future accounts;</text>
<text x="300.0" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">retain primary and secondary positions</text>
<polyline points="300,387 300,415" fill="none" stroke="#555" stroke-width=".8"/>
<polygon points="300,415 303.0,408.0 297.0,408.0" fill="#555"/>
<rect x="90" y="515" width="420" height="72" fill="#fafafa" stroke="#333" stroke-width=".8"/>
<text x="300.0" y="537" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">6  Review and validation</text>
<text x="300.0" y="559" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">Check coverage, evidence, attribution and account consistency;</text>
<text x="300.0" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">document amendments to affected records</text>
<polyline points="300,487 300,515" fill="none" stroke="#555" stroke-width=".8"/>
<polygon points="300,515 303.0,508.0 297.0,508.0" fill="#555"/>
<polyline points="90,251 40,251 40,151 90,151" fill="none" stroke="#555" stroke-width=".8" stroke-dasharray="4 3"/>
<polygon points="90,151 83.0,148.0 83.0,154.0" fill="#555"/>
<text x="25" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#222" transform="rotate(-90 25 201)">Re-extract recovered texts</text>
<polyline points="510,551 560,551 560,451 510,451" fill="none" stroke="#555" stroke-width=".8" stroke-dasharray="4 3"/>
<polygon points="510,451 517.0,454.0 517.0,448.0" fill="#555"/>
<text x="578" y="501" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#222" transform="rotate(90 578 501)">Correct affected records</text>
<polyline points="300,587 300,620 155,620 155,640" fill="none" stroke="#555" stroke-width=".8"/>
<polygon points="155,640 158.0,633.0 152.0,633.0" fill="#555"/>
<polyline points="300,620 445,620 445,640" fill="none" stroke="#555" stroke-width=".8"/>
<polygon points="445,640 448.0,633.0 442.0,633.0" fill="#555"/>
<rect x="20" y="640" width="270" height="80" fill="#fafafa" stroke="#333" stroke-width=".8"/>
<text x="155.0" y="662" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">Interpretation of educational futures</text>
<text x="155.0" y="684" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">Examine links among purposes, roles,</text>
<text x="155.0" y="699" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">evaluations and actor positions</text>
<rect x="310" y="640" width="270" height="80" fill="#fafafa" stroke="#333" stroke-width=".8"/>
<text x="445.0" y="662" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">Descriptive outlet comparison</text>
<text x="445.0" y="684" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">Compare constituent patterns; examine</text>
<text x="445.0" y="699" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#222">composition and sensitivity</text>
<text x="300" y="746" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="normal" fill="#222">Dashed arrows indicate targeted re-extraction or correction.</text>
</svg>